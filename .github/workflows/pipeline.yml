name: Pipeline

env:
  VAULT_ADDR: https://vault.svc.plus

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: uat
        type: choice
        options: [uat, prod]
      target_host:
        description: "Optional host override for the selected environment"
        required: false
        default: ""
        type: string
      run_apply:
        description: "Apply deployment (false = dry-run)"
        required: true
        default: true
        type: boolean
      ai_workspace_auth_token:
        description: "Optional ACP auth token for deploy"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve_profile:
    name: Resolve deployment profile
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.profile.outputs.environment }}
      target_host: ${{ steps.profile.outputs.target_host }}
      run_apply: ${{ steps.profile.outputs.run_apply }}
      bridge_server_url: ${{ steps.profile.outputs.bridge_server_url }}
    steps:
      - id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_TARGET_HOST: ${{ inputs.target_host }}
          INPUT_RUN_APPLY: ${{ inputs.run_apply }}
          UAT_TARGET_HOST: ${{ vars.UAT_TARGET_HOST }}
          UAT_BRIDGE_SERVER_URL: ${{ vars.UAT_BRIDGE_SERVER_URL }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then environment="$INPUT_ENVIRONMENT"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            # Pull requests build and test only; no UAT/prod deployment profile
            # is required and repository variables are intentionally unavailable
            # to forked PRs. Use non-deploying placeholders for downstream jobs.
            environment=uat
            target_host="pr"
            bridge_server_url="http://127.0.0.1:8787"
          elif [[ "$REF" == refs/heads/main ]]; then environment=uat
          elif [[ "$REF" == refs/heads/release/* || "$REF" == refs/tags/v* ]]; then environment=prod
          else echo "::error::No deployment profile for $REF"; exit 1; fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            : # placeholders already set above; deployment steps are skipped.
          elif [[ "$environment" == uat ]]; then
            target_host="${INPUT_TARGET_HOST:-$UAT_TARGET_HOST}"
            bridge_server_url="$UAT_BRIDGE_SERVER_URL"
          else
            target_host="${INPUT_TARGET_HOST:-jp-xhttp-contabo.svc.plus}"
            bridge_server_url="https://xworkmate-bridge.svc.plus"
          fi
          [[ -n "$target_host" && -n "$bridge_server_url" ]] || { echo "::error::target_host and bridge_server_url are required for $environment"; exit 1; }
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "target_host=$target_host" >> "$GITHUB_OUTPUT"
          echo "run_apply=${INPUT_RUN_APPLY:-true}" >> "$GITHUB_OUTPUT"
          echo "bridge_server_url=$bridge_server_url" >> "$GITHUB_OUTPUT"

  production_state:
    name: Current Environment State
    runs-on: ubuntu-latest
    needs: resolve_profile
    outputs:
      production_image: ${{ steps.production_state.outputs.production_image }}
      production_tag: ${{ steps.production_state.outputs.production_tag }}
      production_commit: ${{ steps.production_state.outputs.production_commit }}
      production_version: ${{ steps.production_state.outputs.production_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load Vault secrets
        id: vault
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: github-actions-xworkmate-bridge
          jwtGithubAudience: vault
          ignoreNotFound: true
          secrets: |
            kv/data/github-actions/xworkmate-bridge AI_WORKSPACE_AUTH_TOKEN | AI_WORKSPACE_AUTH_TOKEN

      - name: Export bridge auth token
        if: ${{ steps.vault.outcome == 'success' && steps.vault.outputs.AI_WORKSPACE_AUTH_TOKEN != '' }}
        run: echo "AI_WORKSPACE_AUTH_TOKEN=${{ steps.vault.outputs.AI_WORKSPACE_AUTH_TOKEN }}" >> "$GITHUB_ENV"

      - name: Probe current environment bridge
        id: production_state
        env:
          BRIDGE_SERVER_URL: ${{ needs.resolve_profile.outputs.bridge_server_url }}
        run: |
          if [[ -z "${AI_WORKSPACE_AUTH_TOKEN:-}" ]]; then
            echo "::notice title=Environment state skipped::AI_WORKSPACE_AUTH_TOKEN is unavailable from Vault; continuing without bridge metadata."
            {
              echo "production_image="
              echo "production_tag="
              echo "production_commit="
              echo "production_version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < <(bash ./scripts/github-actions/report-production-state.sh "${BRIDGE_SERVER_URL}")

      - name: Report selected environment state
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "::notice title=Environment state::Current ${{ needs.resolve_profile.outputs.environment }} bridge before this run is ${{ steps.production_state.outputs.production_commit }}."

  prep:
    name: Prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          GOBIN="$(go env GOPATH)/bin"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "${GOBIN}" >> "$GITHUB_PATH"

      - name: Run lint and tests
        run: bash ./scripts/github-actions/prep.sh

  build:
    name: Build
    needs:
      - production_state
      - prep
    runs-on: ubuntu-latest
    env:
      SERVICE_REGISTRY: ghcr.io
      SERVICE_IMAGE_REPO_OWNER: ${{ vars.IMAGE_REPO_OWNER || github.repository_owner }}
      SERVICE_IMAGE_NAME: xworkmate-bridge
    outputs:
      artifact_name: ${{ steps.artifact_meta.outputs.artifact_name }}
      binary_artifact_name: ${{ steps.binary_artifact_meta.outputs.binary_artifact_name }}
      service_image_ref: ${{ steps.service_ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load Vault secrets
        id: vault
        if: ${{ github.event_name != 'pull_request' }}
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: github-actions-xworkmate-bridge
          jwtGithubAudience: vault
          ignoreNotFound: true
          secrets: |
            kv/data/github-actions/xworkmate-bridge GHCR_TOKEN | GHCR_TOKEN

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          password: ${{ steps.vault.outputs.GHCR_TOKEN || github.token }}

      - name: Resolve service image ref
        id: service_ref
        run: bash ./scripts/github-actions/resolve-service-image-ref.sh

      - name: Build and optionally push service image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.service_ref.outputs.image_refs }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
            BUILD_VERSION=v1.0-beta2

      - name: Build native linux service binary
        run: bash ./scripts/github-actions/build-artifact.sh dist/native-binary

      - name: Write image ref artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' "${{ steps.service_ref.outputs.image_ref }}" > dist/service-image-ref.txt

      - name: Record artifact metadata
        id: artifact_meta
        run: bash ./scripts/github-actions/resolve-artifact-name.sh

      - name: Record native binary artifact metadata
        id: binary_artifact_meta
        run: printf 'binary_artifact_name=xworkmate-bridge-linux-amd64-%s\n' "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload image ref artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          path: dist/service-image-ref.txt

      - name: Upload native linux service binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.binary_artifact_meta.outputs.binary_artifact_name }}
          path: dist/native-binary/xworkmate-bridge
