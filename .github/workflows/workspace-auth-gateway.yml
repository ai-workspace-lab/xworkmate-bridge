name: Workspace Auth Gateway

on:
  pull_request:
    paths:
      - "deploy/workspace-auth-gateway/**"
      - ".github/workflows/workspace-auth-gateway.yml"
  push:
    branches: [main]
    paths:
      - "deploy/workspace-auth-gateway/**"
      - ".github/workflows/workspace-auth-gateway.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run gateway security fixtures
        run: node --test deploy/workspace-auth-gateway/gateway.test.mjs
